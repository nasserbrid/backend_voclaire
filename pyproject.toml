[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "backend-voclaire"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.36",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.138.1",
    "fpdf2>=2.8.7",
    "httpx>=0.28.1",
    "logtail-python>=0.4.0",
    "motor>=3.7.1",
    "openai>=2.44.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "posthog>=7.35.4",
    "pydantic-settings>=2.14.2",
    "pydub>=0.25.1",
    "pyjwt>=2.13.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "sentry-sdk[fastapi]>=2.63.0",
    "slowapi>=0.1.10",
    "stripe>=15.3.0",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
